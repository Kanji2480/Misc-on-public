<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="4-7-8呼吸" />
  <title>4-7-8 呼吸タイマー</title>
  <style>
    :root{--bg:#0f172a;--text:#f8fafc;--muted:#94a3b8;--accent:#60a5fa;--ring:#334155}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:radial-gradient(circle at top,#172554 0%,var(--bg) 45%,#020617 100%);
      color:var(--text);display:flex;align-items:center;justify-content:center;
      padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
      -webkit-tap-highlight-color:transparent
    }
    .app{width:min(100%,460px);text-align:center;display:flex;flex-direction:column;gap:18px}
    h1{font-size:clamp(24px,7vw,34px);margin:0;letter-spacing:.02em}
    .sub{margin-top:-10px;color:var(--muted);font-size:14px}
    .circle-wrap{display:grid;place-items:center;min-height:300px}
    .circle{
      width:min(68vw,290px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
      border:7px solid var(--ring);background:rgba(255,255,255,.035);
      box-shadow:0 20px 70px rgba(0,0,0,.3),inset 0 0 40px rgba(255,255,255,.03);
      transition:transform 1s linear,border-color .3s ease,background .3s ease;user-select:none
    }
    .circle.inhale{transform:scale(1.08);border-color:#60a5fa;background:rgba(96,165,250,.10)}
    .circle.hold{transform:scale(1.08);border-color:#a78bfa;background:rgba(167,139,250,.10)}
    .circle.exhale{transform:scale(.88);border-color:#34d399;background:rgba(52,211,153,.10)}
    .circle.done{transform:scale(1);border-color:#fbbf24;background:rgba(251,191,36,.08)}
    .phase{font-size:clamp(30px,10vw,46px);font-weight:800;line-height:1.1}
    .seconds{font-variant-numeric:tabular-nums;font-size:clamp(60px,18vw,92px);line-height:1;font-weight:900;margin-top:8px}
    .progress{color:var(--muted);font-size:15px}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    button,select{min-height:54px;border:0;border-radius:16px;font:inherit;font-weight:700}
    button{cursor:pointer;color:#08111f;background:#f8fafc;padding:14px 16px}
    button.primary{background:var(--accent);color:#071321}
    button:active{transform:translateY(1px)}
    .settings{padding:14px;border-radius:18px;background:rgba(15,23,42,.68);border:1px solid rgba(148,163,184,.18);display:grid;gap:12px;text-align:left}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .row label{font-size:15px}
    select{background:#1e293b;color:var(--text);padding:0 14px}
    input[type="checkbox"]{width:22px;height:22px;accent-color:var(--accent)}
    .hint{font-size:12px;color:var(--muted);line-height:1.5}
  </style>
</head>
<body>
  <main class="app">
    <div>
      <h1>4-7-8 呼吸</h1>
      <div class="sub">吸う 4秒 · 止める 7秒 · 吐く 8秒</div>
    </div>
    <section class="circle-wrap">
      <div id="circle" class="circle"><div><div id="phase" class="phase">準備</div><div id="seconds" class="seconds">4</div></div></div>
    </section>
    <div id="progress" class="progress">0 / 4 セット</div>
    <div class="buttons">
      <button id="startBtn" class="primary">スタート</button>
      <button id="resetBtn">リセット</button>
    </div>
    <section class="settings">
      <div class="row"><label for="cycles">セット数</label><select id="cycles"><option value="2">2</option><option value="4" selected>4</option><option value="6">6</option><option value="8">8</option></select></div>
      <div class="row"><label for="sound">切り替え音</label><input id="sound" type="checkbox" checked /></div>
      <div class="row"><label for="vibrate">振動</label><input id="vibrate" type="checkbox" checked /></div>
      <div class="row"><label for="wake">画面をスリープさせない</label><input id="wake" type="checkbox" checked /></div>
    </section>
    <div class="hint">苦しさ・めまいを感じたら中止してください。振動と画面スリープ防止は対応ブラウザのみ有効です。</div>
  </main>
<script>
(() => {
  const phases=[{key:'inhale',label:'吸う',seconds:4},{key:'hold',label:'止める',seconds:7},{key:'exhale',label:'吐く',seconds:8}];
  const els={circle:document.getElementById('circle'),phase:document.getElementById('phase'),seconds:document.getElementById('seconds'),progress:document.getElementById('progress'),startBtn:document.getElementById('startBtn'),resetBtn:document.getElementById('resetBtn'),cycles:document.getElementById('cycles'),sound:document.getElementById('sound'),vibrate:document.getElementById('vibrate'),wake:document.getElementById('wake')};
  let timer=null,running=false,phaseIndex=0,remaining=4,completedCycles=0,hasStarted=false,wakeLock=null;
  const prefs=JSON.parse(localStorage.getItem('breath478prefs')||'{}');
  ['cycles','sound','vibrate','wake'].forEach(k=>{if(prefs[k]!==undefined){if(els[k].type==='checkbox')els[k].checked=prefs[k];else els[k].value=prefs[k]}});
  function savePrefs(){localStorage.setItem('breath478prefs',JSON.stringify({cycles:els.cycles.value,sound:els.sound.checked,vibrate:els.vibrate.checked,wake:els.wake.checked}))}
  document.querySelectorAll('select,input').forEach(x=>x.addEventListener('change',()=>{savePrefs();updateUI()}));
  function totalCycles(){return Number(els.cycles.value)}
  function beep(freq=660,duration=.10){if(!els.sound.checked)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(.05,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration)}catch(e){}}
  function vibrate(pattern=80){if(els.vibrate.checked&&navigator.vibrate)navigator.vibrate(pattern)}
  async function requestWakeLock(){if(!els.wake.checked||!('wakeLock'in navigator))return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}catch(e){}}
  async function releaseWakeLock(){if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null}}
  function updateUI(){
    if(completedCycles>=totalCycles()){els.circle.className='circle done';els.phase.textContent='完了';els.seconds.textContent='✓';els.progress.textContent=totalCycles()+' / '+totalCycles()+' セット';return}
    const p=phases[phaseIndex];els.circle.className='circle '+(hasStarted?p.key:'');els.phase.textContent=hasStarted?(running?p.label:p.label+'・一時停止'):'準備';els.seconds.textContent=hasStarted?remaining:'4';els.progress.textContent=completedCycles+' / '+totalCycles()+' セット';els.startBtn.textContent=running?'一時停止':(hasStarted?'再開':'スタート')
  }
  function advancePhase(){phaseIndex++;if(phaseIndex>=phases.length){phaseIndex=0;completedCycles++;if(completedCycles>=totalCycles()){finish();return}}remaining=phases[phaseIndex].seconds;beep(phaseIndex===2?520:700,.12);vibrate(100);updateUI()}
  function tick(){remaining--;if(remaining<=0)advancePhase();else updateUI()}
  async function start(){if(completedCycles>=totalCycles())reset();running=true;hasStarted=true;remaining=remaining||phases[phaseIndex].seconds;beep(760,.08);vibrate(60);await requestWakeLock();updateUI();clearInterval(timer);timer=setInterval(tick,1000)}
  function pause(){running=false;clearInterval(timer);timer=null;releaseWakeLock();updateUI()}
  function finish(){running=false;clearInterval(timer);timer=null;beep(880,.25);vibrate([120,80,180]);releaseWakeLock();updateUI();els.startBtn.textContent='もう一度'}
  function reset(){running=false;clearInterval(timer);timer=null;phaseIndex=0;remaining=phases[0].seconds;completedCycles=0;hasStarted=false;releaseWakeLock();updateUI();els.startBtn.textContent='スタート'}
  els.startBtn.addEventListener('click',()=>running?pause():start());els.resetBtn.addEventListener('click',reset);
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&running)await requestWakeLock()});
  updateUI();
})();
</script>
</body>
</html>
